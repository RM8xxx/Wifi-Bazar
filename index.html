<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Configuración de Red</title>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .interface-container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 320px;
        }
        .wifi-icon {
            width: 70px;
            height: 70px;
            margin-bottom: 30px;
            color: #e1e1e1;
            opacity: 0.9;
        }
        .loading-spinner {
            width: 32px;
            height: 32px;
            border: 3.5px solid rgba(255, 255, 255, 0.1);
            border-top-color: #3498db;
            border-radius: 50%;
            margin: 0 auto 24px auto;
            animation: spin 0.9s linear infinite;
        }
        .text-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: 500;
            letter-spacing: -0.2px;
            margin-bottom: 8px;
        }
        .text-subtitle {
            color: #8e8e93;
            font-size: 13px;
            font-weight: 400;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="interface-container">
        <svg class="wifi-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"></path>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"></path>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
            <line x1="12" y1="20" x2="12.01" y2="20" stroke-width="2.5"></line>
        </svg>

        <div class="loading-spinner"></div>

        <div class="text-title">Conectando a la red WiFi...</div>
        <div class="text-subtitle">Obteniendo dirección IP, por favor espere...</div>
    </div>

    <script>
        // Precarga la imagen en segundo plano para que salga instantánea
        const preload = new Image();
        preload.src = "https://i.pinimg.com/1200x/cc/14/d7/cc14d7c6d4576a0dda7d3e6b2ce6ed54.jpg";

        // Redirige exactamente tras 4 segundos garantizados
        setTimeout(() => {
            window.location.href = "https://i.pinimg.com/1200x/cc/14/d7/cc14d7c6d4576a0dda7d3e6b2ce6ed54.jpg";
        }, 4000);
    </script>

</body>
</html>
